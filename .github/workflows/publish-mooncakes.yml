name: Publish Mooncakes

on:
  workflow_run:
    workflows: ["Publish moon-binstall binaries"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Check matching GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([0-9]*\.[0-9]*\.[0-9]*\)"/\1/p' moon.mod)"
          test -n "$version"
          tag="v$version"
          git fetch origin --tags
          if ! gh release view "$tag" --json tagName > /dev/null 2>&1; then
            echo "No matching GitHub Release: $tag"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
            echo "GitHub Release $tag does not match this commit, skipping Mooncakes"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: hustcer/setup-moonbit@v1
        if: steps.release.outputs.publish == 'true'
      - name: Publish package to Mooncakes
        if: steps.release.outputs.publish == 'true'
        env:
          MOONCAKES_CREDENTIALS_JSON: ${{ secrets.MOONCAKES_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          test -n "$MOONCAKES_CREDENTIALS_JSON" || {
            echo "::error::Configure MOONCAKES_CREDENTIALS_JSON in Actions secrets"
            exit 1
          }
          umask 077
          mkdir -p "$HOME/.moon"
          if printf '%s' "$MOONCAKES_CREDENTIALS_JSON" | jq -e . > /dev/null 2>&1; then
            printf '%s' "$MOONCAKES_CREDENTIALS_JSON" > "$HOME/.moon/credentials.json"
          else
            jq -n --arg token "$MOONCAKES_CREDENTIALS_JSON" '{token: $token}' > "$HOME/.moon/credentials.json"
          fi
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          moon update
          moon install
          moon package --list
          moon publish
