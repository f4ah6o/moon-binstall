name: Publish Mooncakes

on:
  workflow_run:
    workflows: ["Publish moon-binstall binaries"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: hustcer/setup-moonbit@v1
      - name: Publish package
        env:
          MOONCAKES_CREDENTIALS_JSON: ${{ secrets.MOONCAKES_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          test -n "$MOONCAKES_CREDENTIALS_JSON"
          mkdir -p "$HOME/.moon"
          umask 077
          printf '%s' "$MOONCAKES_CREDENTIALS_JSON" > "$HOME/.moon/credentials.json"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          moon update
          moon install
          moon package --list
          moon publish
