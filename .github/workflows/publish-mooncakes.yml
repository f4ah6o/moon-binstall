name: Publish Mooncakes

on:
  workflow_run:
    workflows: ["Publish moon-binstall binaries"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Check matching GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([0-9]*\.[0-9]*\.[0-9]*\)"/\1/p' moon.mod)"
          test -n "$version"
          tag="v$version"
          git fetch origin --tags
          if ! gh release view "$tag" --json tagName > /dev/null 2>&1; then
            echo "No matching GitHub Release: $tag"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]; then
            echo "GitHub Release $tag does not match this commit, skipping Mooncakes"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: hustcer/setup-moonbit@v1
        if: steps.release.outputs.publish == 'true'
      - name: Stamp declared glibc-min into moon-binstall.json
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          command -v objdump > /dev/null 2>&1 || sudo apt-get install -y binutils
          version="$(sed -n 's/^version *= *"\([0-9]*\.[0-9]*\.[0-9]*\)"/\1/p' moon.mod)"
          assets="$(gh release view "v$version" --json assets --jq '.assets[].name')"
          measure() {
            # Print the newest GLIBC_* version the asset requires (empty when
            # it has none, e.g. a static or musl build).
            gh release download "v$version" -p "$1" -O "/tmp/$1" --clobber
            objdump -T "/tmp/$1" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1 | sed 's/^GLIBC_//' || true
          }
          tmp="$(mktemp)"
          cp moon-binstall.json "$tmp"
          # For every package entry, measure each Linux release asset that
          # exists. Equal results stamp a shared glibc-min; differing results
          # stamp per-target overrides instead, so an x86_64 measurement is
          # never stamped onto aarch64. Package entries without measurable
          # Linux assets are left untouched.
          count="$(jq '.packages | length' "$tmp")"
          for i in $(seq 1 "$count"); do
            i=$((i - 1))
            binary="$(jq -r ".packages[$i].binary" "$tmp")"
            targets=()
            mins=()
            for target in linux-x86_64 linux-aarch64; do
              asset="$binary-$target"
              if grep -qxF "$asset" <<< "$assets"; then
                targets+=("$target")
                mins+=("$(measure "$asset")")
              fi
            done
            [ "${#targets[@]}" -gt 0 ] || continue
            uniq="$(printf '%s\n' "${mins[@]}" | sort -u | wc -l)"
            if [ "$uniq" -eq 1 ] && [ -n "${mins[0]}" ]; then
              jq --argjson i "$i" --arg min "${mins[0]}" \
                '.packages[$i] += {"glibc-min": $min}' \
                "$tmp" > "$tmp.2" && mv "$tmp.2" "$tmp"
            else
              for j in "${!targets[@]}"; do
                [ -n "${mins[$j]}" ] || continue
                jq --argjson i "$i" --arg t "${targets[$j]}" --arg min "${mins[$j]}" \
                  '.packages[$i].overrides[$t] = ((.packages[$i].overrides[$t] // {}) + {"glibc-min": $min})' \
                  "$tmp" > "$tmp.2" && mv "$tmp.2" "$tmp"
              done
            fi
          done
          if ! cmp -s moon-binstall.json "$tmp"; then
            mv "$tmp" moon-binstall.json
            echo "stamped glibc-min:"
            jq -c '.packages' moon-binstall.json
          else
            echo "no GLIBC_* requirements measured; manifest left unchanged"
          fi
      - name: Publish package to Mooncakes
        if: steps.release.outputs.publish == 'true'
        env:
          MOONCAKES_CREDENTIALS_JSON: ${{ secrets.MOONCAKES_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          test -n "$MOONCAKES_CREDENTIALS_JSON" || {
            echo "::error::Configure MOONCAKES_CREDENTIALS_JSON in Actions secrets"
            exit 1
          }
          umask 077
          mkdir -p "$HOME/.moon"
          if printf '%s' "$MOONCAKES_CREDENTIALS_JSON" | jq -e . > /dev/null 2>&1; then
            printf '%s' "$MOONCAKES_CREDENTIALS_JSON" > "$HOME/.moon/credentials.json"
          else
            jq -n --arg token "$MOONCAKES_CREDENTIALS_JSON" '{token: $token}' > "$HOME/.moon/credentials.json"
          fi
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          moon update
          moon install
          moon package --list
          moon publish
