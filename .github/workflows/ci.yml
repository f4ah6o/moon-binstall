name: MoonBit native CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native test and archive tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bzip2 curl gzip python3 tar unzip xz-utils zstd
      - uses: hustcer/setup-moonbit@v1
      - name: Resolve dependencies
        run: |
          moon update
          moon install
      - name: Check
        run: moon check --target native --deny-warn
      - name: Tests
        run: moon test --target native
      - name: Release version tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_version.py' -v
      - name: Validate Mooncakes package contents
        run: moon package --list
      - name: Build native CLI
        run: moon build --target native --release
      - name: CLI smoke
        run: moon run cmd/main --target native -- --help
      - name: Moon external subcommand delegation
        shell: bash
        run: |
          set -euo pipefail
          binary=$(find _build/native/release/build -type f -name 'main.exe' -print)
          test -n "$binary"
          mkdir -p "$RUNNER_TEMP/moon-extra-bin"
          install -m 755 "$binary" "$RUNNER_TEMP/moon-extra-bin/moon-binstall"
          export PATH="$RUNNER_TEMP/moon-extra-bin:$PATH"
          expected="$(python3 scripts/release_version.py read --kind moon-binstall)"
          test "$(moon binstall --version)" = "moon-binstall ${expected#v}"
          moon binstall --help | grep -q 'Aliases: turtles, hotpath, dsh'
          moon binstall --help | grep -q -- '--manifest-path FILE'
          moon binstall --help | grep -q 'Requires: curl >= 8.4.0'
          set +e
          moon binstall turtles --nonexistent-option > "$RUNNER_TEMP/invalid-option.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'unrecognized or duplicate argument: --nonexistent-option' "$RUNNER_TEMP/invalid-option.log"
